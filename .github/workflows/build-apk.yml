name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html manifest.json www/ 2>/dev/null || true

      - name: Install Dependencies
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Add Android Platform
        run: |
          npx cap add android || true

      - name: Set Android Target SDK to 34 (Android 14)
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle
          fi

      - name: Generate Custom Icons & Sync
        run: |
          # Normalize filenames in assets directory to lowercase
          if [ -d assets ]; then
            cd assets
            for f in *; do mv "$f" "$(echo "$f" | tr '[:upper:]' '[:lower:]')" 2>/dev/null || true; done
            cd ..
          fi

          if [ -f assets/icon-only.png ]; then
            npx @capacitor/assets generate --android || echo "Icon generation warning"
          elif [ -f assets/icon.png ]; then
            cp assets/icon.png assets/icon-only.png
            npx @capacitor/assets generate --android || echo "Icon generation warning"
          fi
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroCraft-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
